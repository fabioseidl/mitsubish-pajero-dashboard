; ─────────────────────────────────────────────────────────────────────────────
; gps_debug — minimal standalone GPS bring-up for the Waveshare ESP32-S3-LCD-7B
;
; Strips the display / LVGL / ESP-NOW stack so the board boots in ~1 s with a
; clean console. Goal: find which GPIO the GPS is on and see its raw NMEA.
;
; Console: same USB path as main_display — UART0 via the onboard CH343 bridge.
;   ARDUINO_USB_CDC_ON_BOOT=0 keeps Serial on UART0 (visible on the CH343 port).
; ─────────────────────────────────────────────────────────────────────────────
[env:waveshare-esp32s3-lcd-7b]
platform = espressif32@6.9.0
board = esp32s3box
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3

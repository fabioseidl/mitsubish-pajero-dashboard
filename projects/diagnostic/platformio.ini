[env:diagnostic]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Same board and CAN hardware as projects/server and projects/sniffer: ESP32-S3
; driving an MCP2515 over SPI, on CAN A (the OBD-II port).
;
; Only lib/core's dtc.h is used, pulled in by include path alone — no
; lib_extra_dirs, so the LDF never registers `core` and never drags ESP-NOW,
; LVGL or the displays into this standalone tool. Same trick as the sniffer.
;
; USB CDC on boot so the S3's native USB enumerates as the serial monitor.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../../lib/core/include

lib_deps = https://github.com/autowp/arduino-mcp2515

monitor_speed = 115200

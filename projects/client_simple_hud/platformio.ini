[platformio]
; `pio run` builds the firmware only; the simulator envs are opt-in with -e.
default_envs = client_simple_hud

; One LVGL for the firmware and the simulator — a version gap between them breaks
; the pixel match the lvgl-preview skill relies on.
[lvgl]
dep = lvgl/lvgl @ 9.5.0

[env:client_simple_hud]
platform  = espressif32@6.9.0
board     = esp32doit-devkit-v1
framework = arduino

lib_deps =
    ${lvgl.dep}
    lovyan03/LovyanGFX @ ^1.2.0

lib_extra_dirs = ../../lib

build_src_filter = +<*>

build_flags    =
    -I../../lib/core/include
    -I../../projects/client_simple_hud/include
    -I../../projects/client_simple_hud/src
    -I${PROJECT_LIBDEPS_DIR}/client_simple_hud
    -DLV_CONF_INCLUDE_SIMPLE

monitor_speed = 115200
board_build.partitions = huge_app.csv

; ── Native simulator ─────────────────────────────────────────────────────────
; SimpleHudUi + sim/sim_main.cpp built for the host with the same lv_conf.h, so
; a frame here is pixel-identical to what LVGL hands the panel. Used by the
; lvgl-preview skill. `sim` is headless (PPM out, no deps); `sim_sdl` adds a
; window and needs `brew install sdl2`.
[env:sim]
platform = native
build_src_filter = -<*> +<simple_hud_ui.cpp> +<ui_font_*.c> +<ui_img_*.c> +<../sim/sim_main.cpp>
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}
lib_deps =
    ${lvgl.dep}

[env:sim_sdl]
extends = env:sim
build_flags =
    ${env:sim.build_flags}
    -DSIM_SDL
    !sdl2-config --cflags --libs


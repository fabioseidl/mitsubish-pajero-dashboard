[env:server]
; Pinned, like every client project. The Arduino core / IDF version selects the
; ESP-NOW callback signatures that lib/core deduces at compile time, and the SPI
; and deep-sleep behaviour this board was validated against in the car. An
; unpinned `espressif32` silently moves all of that on a fresh checkout.
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

lib_extra_dirs = ../../lib

build_flags =
    -DUSE_MCP2515
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Qwiic sensors: MPU9250_WE ships MPU6500_WE (the IMU is a 6500 die); same
; versions main_display was validated with.
lib_deps =
    https://github.com/autowp/arduino-mcp2515
    wollewald/MPU9250_WE @ ^1.2.17
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1

monitor_speed = 115200

; Bench build with the board off the vehicle CAN bus: onboard sensors only, no
; deep sleep. Never flash this in the car — it would drain the battery.
[env:server_nocan]
extends     = env:server
build_flags =
    ${env:server.build_flags}
    -DSERVER_NO_CAN

[env:sniffer]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_extra_dirs = ../../lib

; Same board + CAN hardware as projects/server: ESP32-S3 driving an MCP2515 over
; SPI (CAN A = the OBD-II port). USB CDC on boot so the S3's native USB enumerates
; as the serial monitor, matching the server build.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = https://github.com/autowp/arduino-mcp2515

monitor_speed = 115200

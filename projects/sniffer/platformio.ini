[env:sniffer]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Pull in the shared PID tables (lib/core/include/pid_map.h) by include path only
; (the -I below). We deliberately DON'T add lib/core via lib_extra_dirs, so the
; default LDF never registers `core` as a library and never compiles the rest of
; it (ESP-NOW, WiFi, displays) into this CAN-only tool — we just need the header.
;
; Same board + CAN hardware as projects/server: ESP32-S3 driving an MCP2515 over
; SPI (CAN A = the OBD-II port). USB CDC on boot so the S3's native USB enumerates
; as the serial monitor, matching the server build.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../../lib/core/include
lib_deps = https://github.com/autowp/arduino-mcp2515

monitor_speed = 115200

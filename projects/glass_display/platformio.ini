; Waveshare ESP32-C6-LCD-1.47 — speed-only ESP-NOW client
;
; RISC-V ESP32-C6 with an onboard 1.47" ST7789 172x320 SPI LCD (no touch, no
; PSRAM, 4 MB flash). Board setup mirrors the baby-health-monitor project.
;
; Platform note: the ESP32-C6 needs Arduino-ESP32 core 3.x, which the official
; `espressif32` platform does not ship, so this project uses the community
; "pioarduino" fork (Arduino 3.2.1 / ESP-IDF 5.4.2). Arduino_GFX's SPI driver
; needs IDF >= 5.3, so do not drop to an older release. This is the only project
; in the repo on core 3.x — lib/core carries the IDF 4/5 shims that make it build.

[env:glass_display]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board     = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200

; 4 MB flash, no PSRAM. huge_app.csv (3 MB app) so LVGL + Arduino_GFX + the
; Wi-Fi stack fit; the default 1.3 MB app partition is too small.
board_upload.flash_size = 4MB
board_build.flash_size  = 4MB
board_build.partitions  = huge_app.csv

build_flags =
    ; Native USB-CDC: Serial goes over the C6's built-in USB (GPIO12/13).
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL configured by flags only (library defaults + these overrides).
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_USE_LOG=0
    ; Windshield reflection: set to 1 to flip the frame on its way to the panel.
    ; Mirrored-and-upside-down reflection is GLASS_MIRROR_Y=1 alone (see
    ; glass_screen_controller.cpp). Retune against the real glass.
    -D GLASS_MIRROR_X=0
    -D GLASS_MIRROR_Y=0
    -Iinclude
    ; Shared core lib (Payload, ESPNowReceiver, ServerConnectionMonitor, IDisplay)
    -I../../lib/core/include
    ; libdeps parent on the path so the font .c can #include "lvgl.h"
    -I${PROJECT_LIBDEPS_DIR}/glass_display

; Pulls in lib/core so its .cpp files (espnow_receiver, etc.) compile.
lib_extra_dirs = ../../lib

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.4.9
    lvgl/lvgl @ ^9.2.2

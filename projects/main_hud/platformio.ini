; Guition JC3248W535 (ESP32-S3-N16R8) — speed-only display / windshield HUD
;
; Unlike the other clients this project uses Arduino_GFX rather than LovyanGFX:
; the panel's AXS15231B sits on a QSPI bus, and no released LovyanGFX version
; ships a driver for it. Everything above the driver (Payload, ESPNowReceiver,
; ServerConnectionMonitor, IDisplay) is the same shared lib/core as the rest.

[env:main_hud]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Flash / RAM ──────────────────────────────────────────────────────────────
; ESP32-S3R8: 16 MB quad (QIO) flash + 8 MB embedded octal (OPI) PSRAM, both
; confirmed with `esptool.py flash_id` on the real board. PSRAM is required —
; the Arduino_Canvas framebuffer is 320*480*2 = 307 KB and cannot fit in SRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB

; board_upload.flash_size is NOT redundant with board_build.flash_size above.
; esp32-s3-devkitc-1 declares 8 MB, and *this* is the value esptool stamps into
; the bootloader image header. Leaving it at 8 MB while board_build.partitions
; points at default_16MB.csv (spiffs at 0xc90000, coredump at 0xFF0000 — both
; past 8 MB) makes the bootloader reject the partition table and reset ~25 ms
; after entry, in a silent loop: bootloader logs go to UART0, which this board
; does not expose. Symptom is an endless ESP-ROM banner and no app output.
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_upload.maximum_ram_size   = 327680
board_build.partitions          = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; This board has NO USB-UART bridge chip — the ESP32-S3's native USB-Serial-JTAG
    ; is the only port. So, unlike projects/main_display (whose board does have a
    ; bridge and therefore needs CDC_ON_BOOT=0), here:
    ;   USB_MODE=1 + CDC_ON_BOOT=1 → Serial = HWCDC → USB-Serial-JTAG → visible.
    ;   CDC_ON_BOOT=0             → Serial = UART0 on GPIO43/44 → goes nowhere.
    ; Note the IDF console (bootloader logs, panic backtraces) is UART0 regardless,
    ; so crash backtraces are NOT visible over USB — only Serial prints are. Debug
    ; by print, or wire a UART adapter to GPIO43/44 for backtraces.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL finds lv_conf.h by simple include — it lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Shared core lib (Payload, ESPNowReceiver, ServerConnectionMonitor, IDisplay)
    -I../../lib/core/include
    ; libdeps parent on the path so sources can #include "lvgl.h"
    -I${PROJECT_LIBDEPS_DIR}/main_hud

; Pulls in lib/core so its .cpp files (espnow_receiver, etc.) compile.
lib_extra_dirs = ../../lib

lib_deps =
    ; Held at 1.5.x on purpose: 1.6.0+ includes esp32-hal-periman.h, which only
    ; exists in Arduino core 3.x, while espressif32@6.9.0 pins core 2.0.17.
    ; Moving to ^1.6 means bumping the platform across the whole repo.
    moononournation/GFX Library for Arduino @ ~1.5.0
    lvgl/lvgl @ ^9.2.2

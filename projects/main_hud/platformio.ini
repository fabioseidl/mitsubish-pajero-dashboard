; Guition JC3248W535 (ESP32-S3-N16R8) — speed-only display / windshield HUD
;
; Unlike the other clients this project uses Arduino_GFX rather than LovyanGFX:
; the panel's AXS15231B sits on a QSPI bus, and no released LovyanGFX version
; ships a driver for it. Everything above the driver (Payload, ESPNowReceiver,
; ServerConnectionMonitor, IDisplay) is the same shared lib/core as the rest.

[env:main_hud]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Flash / RAM ──────────────────────────────────────────────────────────────
; N16R8 module: 16 MB QIO flash + 8 MB OPI PSRAM. PSRAM is required — the
; Arduino_Canvas framebuffer is 320*480*2 = 307 KB and cannot fit in SRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.maximum_size       = 16777216
board_upload.maximum_ram_size   = 327680
board_build.partitions          = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-CDC on boot: this board exposes the S3's native USB, so Serial output
    ; arrives over the same USB-C cable used for flashing.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    ; LVGL finds lv_conf.h by simple include — it lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Shared core lib (Payload, ESPNowReceiver, ServerConnectionMonitor, IDisplay)
    -I../../lib/core/include
    ; libdeps parent on the path so sources can #include "lvgl.h"
    -I${PROJECT_LIBDEPS_DIR}/main_hud

; Pulls in lib/core so its .cpp files (espnow_receiver, etc.) compile.
lib_extra_dirs = ../../lib

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.0
    lvgl/lvgl @ ^9.2.2

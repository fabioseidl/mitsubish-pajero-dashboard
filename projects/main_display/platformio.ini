; Waveshare ESP32-S3-Touch-LCD-7B — main_display application
[env:main_display]
platform  = espressif32@6.9.0
board     = esp32s3box
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ── Flash / RAM ──────────────────────────────────────────────────────────────
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_upload.maximum_size       = 16777216
board_upload.maximum_ram_size   = 524288
board_build.partitions          = huge_app.csv

; ── Sources ───────────────────────────────────────────────────────────────────
; The UI is hand-written in src/ (dashboard_ui / dashboard_widgets) — there is
; no SquareLine Studio export to compile in.
build_src_filter = +<*>

; ── Build flags ───────────────────────────────────────────────────────────────
build_unflags = -DARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_MODE
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_IDF_TARGET_ESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -I../../lib/core/include
    -I../../projects/main_display/src
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}
    -DLV_CONF_INCLUDE_SIMPLE

; ── Libraries ─────────────────────────────────────────────────────────────────
lib_deps =
    lovyan03/LovyanGFX @ ~1.1.16   ; pinned to 1.1.x — the version verified for this RGB panel (BOARD_SPEC §10). 1.2.x leaves the panel dark.
    lvgl/lvgl @ ^9.5.0

lib_extra_dirs = ../../lib
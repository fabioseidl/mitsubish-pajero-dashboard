; Waveshare ESP32-S3-Touch-LCD-7B — Hello World
; Goal: verify display and backlight wiring before adding LVGL / ESPHome
[platformio]
; `pio run` builds the firmware only; the simulator envs are opt-in with -e.
default_envs = waveshare-esp32s3-lcd-7b

; One LVGL for the firmware and the simulator — a version gap between them breaks
; the pixel match the lvgl-preview skill relies on.
[lvgl]
dep = lvgl/lvgl @ 9.5.0

; The dashboard UI, shared by the firmware and the simulator: the hand-written
; view, its bridge, and only the converted assets it uses. src/ui/ also holds the
; old SquareLine screen code, which is not compiled.
[dashboard]
ui_src =
    +<dashboard_view.cpp>
    +<app_ui.cpp>
    +<ui/ui_font_robotobold120.c>
    +<ui/ui_font_robotobold60.c>
    +<ui/ui_font_robotoregular20.c>
    +<ui/ui_font_robotoregular28.c>
    +<ui/ui_font_robotoregular50.c>
    +<ui/ui_img_background_png.c>
    +<ui/ui_img_icon_temperature_png.c>

[env:waveshare-esp32s3-lcd-7b]
platform = espressif32@6.9.0
board = esp32s3box          ; same board profile used in ESPHome; has OPI PSRAM pre-configured
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Board code (main.cpp bring-up + ESP-NOW glue, GPS, touch) plus the shared UI.
; main_display.cpp and the legacy dashboard_ui/dashboard_widgets are not built.
build_src_filter =
    +<main.cpp>
    +<gps.cpp>
    +<gt911.cpp>
    ${dashboard.ui_src}

; Pre-build cleanup: delete cloud-sync conflict copies (e.g. "ui_themes 2.c")
; that the SquareLine export leaves under src/ — they duplicate every symbol and
; break the link. (build_src_filter can't exclude them: it splits on the space
; in the filename.)
extra_scripts = pre:scripts/clean_dupes.py

; ── Flash / RAM ──────────────────────────────────────────────────────────────
board_build.arduino.memory_type = qio_opi   ; QIO 16 MB flash + OPI (octal) PSRAM
board_build.flash_mode          = qio
board_build.flash_size          = 16MB      ; full 16 MB part — needed for the table below
board_upload.maximum_size       = 16777216  ; 16 MB
board_upload.maximum_ram_size   = 524288    ; 512 KB internal SRAM

; Partition table. The board default only gives the app a 1.25 MB slot (0x140000),
; so the SquareLine UI (large fonts + logo image compiled into flash) overflowed it.
; default_16MB.csv (shipped with the Arduino-ESP32 core) gives each app/OTA slot
; ~6.5 MB and leaves a ~3.4 MB SPIFFS partition — plenty of headroom on this 16 MB part.
board_build.partitions          = default_16MB.csv

; ── Build flags ───────────────────────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    ; Tell LovyanGFX to include Panel_RGB / Bus_RGB (gated behind this flag)
    -DCONFIG_IDF_TARGET_ESP32S3
    ; USB JTAG mode: ROM + Arduino core [I] messages AND our Serial all flow
    ; through UART0, bridged to USB via the JTAG endpoint.
    ; ARDUINO_USB_CDC_ON_BOOT=0 is REQUIRED: without it the esp32s3box board
    ; config enables USB-CDC on boot, making Serial → USB-CDC (different
    ; endpoint from the JTAG bridge), so Serial.printf() is invisible.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; Shared core lib (Payload, ESPNowReceiver, ServerConnectionMonitor, …)
    -I../../lib/core/include
    ; LVGL looks up lv_conf.h by simple include — it lives in src/
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    ; libdeps parent on the path so dashboard_*.cpp can #include "lvgl/lvgl.h"
    -I${PROJECT_LIBDEPS_DIR}/waveshare-esp32s3-lcd-7b

; ── Libraries ─────────────────────────────────────────────────────────────────
; lib_extra_dirs pulls in lib/core so its .cpp (espnow_receiver, etc.) compile.
lib_extra_dirs = ../../lib

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    ${lvgl.dep}
    mikalhart/TinyGPSPlus @ ^1.0.3

; ── Native simulator ─────────────────────────────────────────────────────────
; The shared dashboard UI + sim/sim_main.cpp built for
; the host with the same lv_conf.h, so a frame here is pixel-identical to what
; LVGL hands the panel. Used by the lvgl-preview skill. `sim` is headless (PPM
; out, no deps); `sim_sdl` adds a window and needs `brew install sdl2`.
[env:sim]
platform = native
build_src_filter =
    ${dashboard.ui_src}
    +<../sim/*.cpp>
    +<../../../lib/core/src/step_brightness.cpp>
build_flags =
    -std=c++17
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -I../../lib/core/include
    -I${PROJECT_LIBDEPS_DIR}/${PIOENV}
lib_deps =
    ${lvgl.dep}

[env:sim_sdl]
extends = env:sim
build_flags =
    ${env:sim.build_flags}
    -DSIM_SDL
    !sdl2-config --cflags --libs

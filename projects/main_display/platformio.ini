; Waveshare ESP32-S3-Touch-LCD-7B — Hello World
; Goal: verify display and backlight wiring before adding LVGL / ESPHome
[env:waveshare-esp32s3-lcd-7b]
platform = espressif32@6.9.0
board = esp32s3box          ; same board profile used in ESPHome; has OPI PSRAM pre-configured
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build main.cpp (display + backlight bring-up + ESP-NOW glue) together with the
; SquareLine Studio interface under src/ui/ (compiled recursively by +<*>) and the
; app_ui.cpp bridge that maps the Payload onto its labels. The old hand-written
; dashboard (dashboard_ui.cpp / dashboard_widgets.cpp) is excluded — replaced by
; the SquareLine UI. main_display.cpp is the standalone IDisplay impl and is unused.
build_src_filter = +<*> -<main_display.cpp> -<dashboard_ui.cpp> -<dashboard_widgets.cpp>

; ── Flash / RAM ──────────────────────────────────────────────────────────────
board_build.arduino.memory_type = qio_opi   ; QIO 16 MB flash + OPI (octal) PSRAM
board_build.flash_mode          = qio
board_build.flash_size          = 16MB      ; full 16 MB part — needed for the table below
board_upload.maximum_size       = 16777216  ; 16 MB
board_upload.maximum_ram_size   = 524288    ; 512 KB internal SRAM

; Partition table. The board default only gives the app a 1.25 MB slot (0x140000),
; so the SquareLine UI (large fonts + logo image compiled into flash) overflowed it.
; default_16MB.csv (shipped with the Arduino-ESP32 core) gives each app/OTA slot
; ~6.5 MB and leaves a ~3.4 MB SPIFFS partition — plenty of headroom on this 16 MB part.
board_build.partitions          = default_16MB.csv

; ── Build flags ───────────────────────────────────────────────────────────────
build_flags =
    -DBOARD_HAS_PSRAM
    ; Tell LovyanGFX to include Panel_RGB / Bus_RGB (gated behind this flag)
    -DCONFIG_IDF_TARGET_ESP32S3
    ; USB JTAG mode: ROM + Arduino core [I] messages AND our Serial all flow
    ; through UART0, bridged to USB via the JTAG endpoint.
    ; ARDUINO_USB_CDC_ON_BOOT=0 is REQUIRED: without it the esp32s3box board
    ; config enables USB-CDC on boot, making Serial → USB-CDC (different
    ; endpoint from the JTAG bridge), so Serial.printf() is invisible.
    -DARDUINO_USB_MODE=1
    ; -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    ; Shared core lib (Payload, ESPNowReceiver, ServerConnectionMonitor, …)
    -I../../lib/core/include
    ; LVGL looks up lv_conf.h by simple include — it lives in src/
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    ; libdeps parent on the path so dashboard_*.cpp can #include "lvgl/lvgl.h"
    -I${PROJECT_LIBDEPS_DIR}/waveshare-esp32s3-lcd-7b

; ── Libraries ─────────────────────────────────────────────────────────────────
; lib_extra_dirs pulls in lib/core so its .cpp (espnow_receiver, etc.) compile.
lib_extra_dirs = ../../lib

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^9.5.0

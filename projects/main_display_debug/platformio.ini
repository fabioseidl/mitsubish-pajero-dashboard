[env:main_display_debug]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    lvgl/lvgl @ ^8.4.0
    lovyan03/LovyanGFX @ ^1.2.0

lib_extra_dirs = ../../lib

build_flags =
    -I../../lib/core/include
    -I${PROJECT_DIR}/include
    -I${PROJECT_DIR}/src
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

board_build.arduino.memory_type = qio_opi
board_build.partitions          = huge_app.csv
monitor_speed                   = 115200
monitor_filters                 = esp32_exception_decoder

; NOTE: ESP32_Display_Panel v0.1.6 uses brace-aggregate init on ledc_timer_config_t
; which fails with the ledc.h version bundled in espressif32@6.9.0.
; LovyanGFX (^1.2.0) is used instead — it supports ESP32-S3 RGB parallel panels
; (ST7262) and GT911 touch natively, and is already proven in this repo.
; ESP_Panel_Board_Custom.h is kept for reference but is no longer compiled.

; LilyGo T-2CAN (ESP32-S3, 16 MB flash, 8 MB embedded PSRAM, native USB)
;
; The emulator needs no CAN hardware; the T-2CAN is simply the bench board it
; runs on. Pinned to the official platform: a bare `espressif32` resolves to
; whichever espressif32 is installed globally, which is the pioarduino fork once
; projects/glass_display has been built.

[env:server_emulator]
platform  = platformio/espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; esp32-s3-devkitc-1 declares 8 MB; the T-2CAN module has 16 MB. The upload size
; is what esptool stamps into the image header, so set both.
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB

; Headers from the shared lib and the real server come in by include path only.
; We deliberately do NOT use lib_extra_dirs (which would make PlatformIO compile
; the whole lib/core library, including the Arduino-only display/receiver classes
; that don't build under this espidf framework). Instead the few core/server
; sources the emulator actually needs are listed explicitly in build_src_filter.
build_flags    =
    -I../../lib/core/include
    -I../../projects/server/include

; Pull in the specific shared sources this emulator depends on:
;   session_accumulator (projects/server) and espnow_broadcaster (lib/core).
build_src_filter =
    +<*>
    +<../../../projects/server/src/session_accumulator.cpp>
    +<../../../lib/core/src/espnow_broadcaster.cpp>

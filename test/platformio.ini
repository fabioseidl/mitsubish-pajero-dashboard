; Host tests live in `host/`, as two PlatformIO suites: host/test_lib (shared
; lib/core classes) and host/test_server (server-side classes). PlatformIO only
; treats subfolders named `test_*` as suites; `host/mocks/` is shared headers, not
; a suite. Without test_dir this defaulted to `test/`, which used to hold a stale
; duplicate of both suites — that copy was what `pio test` actually built, so the
; real tests never ran. The duplicate is gone; keep this pointing at `host`.
[platformio]
test_dir = host

[env:native_tests]
platform = native

build_flags =
    -std=c++17
    -I../lib/core/include
    -I../projects/server/include
    -I../projects/server_emulator/include
    -DUNIT_TEST

test_framework = unity
